<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rare Book Poster & Caption Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- html2canvas for high-res image export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f1117;
      --card-bg: #1a1d26;
      --accent: #d4af37;
      --accent-hover: #b8972e;
      --text-main: #f0f2f5;
      --text-muted: #9ba1b0;
      --border-color: #2e3444;
      --poster-paper: #fbfbf9;
      --poster-text: #1a1a1a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px;
      min-height: 100vh;
    }

    .app-container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 32px;
      align-items: start;
    }

    @media (max-width: 1080px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Left Control Panel */
    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    input[type="text"], textarea {
      width: 100%;
      background: #12141c;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 160px;
      line-height: 1.4;
    }

    .file-dropzone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: #12141c;
      transition: all 0.2s;
    }

    .file-dropzone:hover {
      border-color: var(--accent);
      background: #161922;
    }

    .btn {
      background: var(--accent);
      color: #12141c;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #242938;
      color: #fff;
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #2e3547;
    }

    /* Right Preview Section */
    .preview-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .poster-wrapper {
      display: flex;
      justify-content: center;
      background: #090a0d;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: auto;
    }

    /* Exact Poster Design (Square 1:1 Aspect Ratio) */
    #poster-canvas {
      width: 650px;
      height: 650px;
      background: #000;
      display: flex;
      flex-direction: column;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .poster-body {
      display: flex;
      flex: 1;
      height: calc(100% - 48px);
      width: 100%;
    }

    /* Left Image Area */
    .poster-image-pane {
      width: 66%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .poster-image-pane img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 4px 16px rgba(0,0,0,0.8);
    }

    /* Right Metadata Area */
    .poster-info-pane {
      width: 34%;
      height: 100%;
      background: var(--poster-paper);
      color: var(--poster-text);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      font-family: 'Playfair Display', serif;
      border-left: 1px solid rgba(0,0,0,0.06);
    }

    .book-header {
      border-bottom: 1.5px solid #222;
      padding-bottom: 12px;
      margin-bottom: 14px;
      text-align: center;
    }

    .book-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      line-height: 1.25;
      text-transform: uppercase;
      font-family: 'Cinzel', serif;
    }

    .book-author {
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      margin-top: 6px;
      font-weight: 600;
      text-transform: uppercase;
      color: #333;
    }

    .meta-table {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
      justify-content: flex-start;
      font-size: 0.78rem;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 85px 1fr;
      align-items: baseline;
      line-height: 1.25;
    }

    .meta-label {
      font-weight: 700;
      color: #111;
    }

    .meta-val {
      font-weight: 400;
      color: #222;
      word-break: break-word;
    }

    /* Poster Bottom Bar */
    .poster-footer {
      height: 48px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-top: 1px solid #e0e0e0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .footer-bookcode {
      font-weight: 800;
      font-size: 0.95rem;
      color: #000;
      letter-spacing: 0.3px;
    }

    .footer-branding {
      font-weight: 800;
      font-size: 0.95rem;
      color: #000;
    }

    /* Instagram Caption Box */
    .caption-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .caption-content {
      background: #12141c;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.9rem;
      color: #e2e4e9;
      white-space: pre-wrap;
      max-height: 220px;
      overflow-y: auto;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- INPUT / SETTINGS PANEL -->
    <div class="control-panel">
      <div class="panel-title">📚 Book Poster Generator</div>

      <div class="form-group">
        <label>1. Book Cover Image</label>
        <div class="file-dropzone" onclick="document.getElementById('coverInput').click()">
          <span id="upload-status">📷 Click or Drop Book Cover</span>
          <input type="file" id="coverInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)" />
        </div>
      </div>

      <div class="form-group">
        <label>2. Paste Book Details</label>
        <textarea id="rawTextInput" placeholder="Paste your text details here..."></textarea>
      </div>

      <div class="form-group">
        <label>3. Book Code</label>
        <input type="text" id="bookCodeInput" value="BC-1959-01" placeholder="e.g. Book Code 1024" />
      </div>

      <button class="btn" onclick="processInput()">⚡ Update Poster & Caption</button>
      <button class="btn btn-secondary" onclick="downloadPoster()">📥 Download Poster (PNG)</button>
    </div>

    <!-- PREVIEW & INSTAGRAM CAPTION -->
    <div class="preview-section">
      <!-- Live Poster Canvas -->
      <div class="poster-wrapper">
        <div id="poster-canvas">
          <div class="poster-body">
            <div class="poster-image-pane">
              <img id="posterCoverImg" src="" alt="Book Cover" style="display: none;" />
            </div>
            <div class="poster-info-pane">
              <div class="book-header">
                <div class="book-title" id="dispTitle">THE GOSPELS</div>
                <div class="book-author" id="dispAuthor">JAMES MOFFATT</div>
              </div>
              <div class="meta-table" id="dispMetaTable">
                <!-- Dynamically Populated -->
              </div>
            </div>
          </div>
          <div class="poster-footer">
            <div class="footer-bookcode" id="dispFooterCode">Book Code: BC-1959-01</div>
            <div class="footer-branding">#findrarebooks</div>
          </div>
        </div>
      </div>

      <!-- Instagram Caption Area -->
      <div class="caption-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label style="color: #fff;">✨ Instagram Ready Caption</label>
          <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="copyCaption()">📋 Copy Caption</button>
        </div>
        <div class="caption-content" id="captionOutput">Click "Update Poster & Caption" to generate caption...</div>
      </div>
    </div>
  </div>

  <script>
    // Initial Default Data matching the user's input
    const initialText = `Book Name: The Moffatt Translation of the Gospels / The Gospels
Author: James Moffatt (Translator)
Publisher: Hodder and Stoughton
Year: 1959
Binding: Paperback
Condition: Very Good
Edition: First Paperback Edition
Printed in: England
Notes: First published in this form 1959; original price 2/6 net; printed and bound by Hazell Watson and Viney Ltd.`;

    document.getElementById('rawTextInput').value = initialText;

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('posterCoverImg');
          img.src = e.target.result;
          img.style.display = 'block';
          document.getElementById('upload-status').innerText = '✅ ' + file.name;
        };
        reader.readAsDataURL(file);
      }
    }

    function parseDetails(text) {
      const lines = text.split('\n');
      const data = {};

      lines.forEach(line => {
        const colonIdx = line.indexOf(':');
        if (colonIdx !== -1) {
          const key = line.substring(0, colonIdx).trim();
          const val = line.substring(colonIdx + 1).trim();
          if (key && val) {
            data[key] = val;
          }
        }
      });
      return data;
    }

    function processInput() {
      const text = document.getElementById('rawTextInput').value;
      const bookCode = document.getElementById('bookCodeInput').value.trim();
      const parsed = parseDetails(text);

      // Header handling
      const title = parsed['Book Name'] || parsed['Title'] || 'RARE BOOK';
      const author = parsed['Author'] || '';
      
      // Clean short title for Header display if slash exists
      const shortTitle = title.includes('/') ? title.split('/')[1].trim() : title;
      document.getElementById('dispTitle').innerText = shortTitle;
      document.getElementById('dispAuthor').innerText = author;

      // Table attributes
      const tableContainer = document.getElementById('dispMetaTable');
      tableContainer.innerHTML = '';

      const allowedKeys = ['Title', 'Book Name', 'Author', 'Publisher', 'Publication Date', 'Year', 'Binding', 'Condition', 'Edition', 'Printed in', 'Notes'];

      // Combine keys smartly
      const normalizedData = {
        'Title': parsed['Book Name'] || parsed['Title'] || '',
        'Author': parsed['Author'] || '',
        'Publisher': parsed['Publisher'] || '',
        'Publication Date': parsed['Publication Date'] || parsed['Year'] || '',
        'Binding': parsed['Binding'] || '',
        'Condition': (parsed['Condition'] && parsed['Condition'] !== 'N/A') ? parsed['Condition'] : 'Vintage / Good',
        'Edition': parsed['Edition'] || '',
        'Printed in': parsed['Printed in'] || '',
        'Notes': parsed['Notes'] || ''
      };

      for (const [key, val] of Object.entries(normalizedData)) {
        if (val) {
          const row = document.createElement('div');
          row.className = 'meta-row';
          row.innerHTML = `<span class="meta-label">${key}</span><span class="meta-val">${val}</span>`;
          tableContainer.appendChild(row);
        }
      }

      // Footer Book Code
      document.getElementById('dispFooterCode').innerText = bookCode ? `Book Code ${bookCode}` : 'Book Code';

      // Instagram Caption Generation
      generateInstagramCaption(normalizedData, bookCode);
    }

    function generateInstagramCaption(data, code) {
      const title = data['Title'] || 'Rare Vintage Book';
      const author = data['Author'] || 'Unknown';
      const year = data['Publication Date'] || '';
      const publisher = data['Publisher'] || '';
      const edition = data['Edition'] || '';
      const notes = data['Notes'] || '';

      const hashtags = [
        '#findrarebooks',
        '#rarebooks',
        '#vintagebooks',
        '#bookcollector',
        '#firstedition',
        '#oldbooks',
        '#bookish',
        `#${title.replace(/[^a-zA-Z0-9]/g, '').toLowerCase()}`,
        `#${author.replace(/[^a-zA-Z0-9]/g, '').toLowerCase()}`
      ].filter(t => t.length > 2).join(' ');

      const caption = `📖 NOW AVAILABLE: ${title.toUpperCase()} 

Rare vintage collectible find for book lovers and collectors! ✨

📌 Book Details:
• Title: ${title}
• Author/Translator: ${author}
• Publisher: ${publisher}
• Year: ${year}
• Edition: ${edition}
• Notes: ${notes}
• Inventory Code: ${code}

📩 DM us directly to claim or purchase.
📦 Worldwide shipping available.

.
.
${hashtags}`;

      document.getElementById('captionOutput').innerText = caption;
    }

    function copyCaption() {
      const text = document.getElementById('captionOutput').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('✅ Instagram caption copied to clipboard!');
      });
    }

    function downloadPoster() {
      const posterElement = document.getElementById('poster-canvas');
      html2canvas(posterElement, {
        scale: 2, // High resolution output
        useCORS: true
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Poster_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // Initial Trigger on page load
    processInput();
  </script>
</body>
</html>
