<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Book Poster Studio · Find Rare Books</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-body: #0b0d11;
      --bg-card: #14171e;
      --bg-input: #0f1118;
      --border-color: #262b3a;
      --gold: #d4af37;
      --gold-hover: #b8972e;
      --text-light: #ffffff;
      --text-muted: #8e95a5;
      --radius: 12px;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-body);
      color: var(--text-light);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app { max-width: 1200px; width: 100%; }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .app-header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--gold);
      font-family: 'Cinzel', serif;
    }

    .app-header .tagline { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

    .studio-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 900px) { .studio-grid { grid-template-columns: 1fr; } }

    .controls {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .controls .group { display: flex; flex-direction: column; gap: 6px; }

    .controls .group label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .controls .group input,
    .controls .group textarea {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.85rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      outline: none;
      transition: 0.2s;
      width: 100%;
      resize: vertical;
    }

    .controls .group textarea { min-height: 130px; line-height: 1.4; }

    .controls .group input:focus,
    .controls .group textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
    }

    .upload-zone {
      background: var(--bg-input);
      border: 1.5px dashed var(--border-color);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .upload-zone:hover { border-color: var(--gold); background: #1a1e2a; }
    .upload-zone.loaded { border-color: #22c55e; color: #22c55e; }

    /* ---- Theme picker ---- */
    .theme-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .theme-swatch {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
      flex: 0 0 auto;
      transition: 0.15s;
    }

    .theme-swatch:hover { transform: translateY(-2px); }
    .theme-swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--gold); }

    .theme-swatch[data-theme="navy-gold"] { background: linear-gradient(135deg, #182a40 50%, #c9a13c 50%); }
    .theme-swatch[data-theme="emerald-gold"] { background: linear-gradient(135deg, #173829 50%, #c9a13c 50%); }
    .theme-swatch[data-theme="burgundy-gold"] { background: linear-gradient(135deg, #54101f 50%, #c9a13c 50%); }
    .theme-swatch[data-theme="sepia-brass"] { background: linear-gradient(135deg, #4a3420 50%, #9c7a35 50%); }
    .theme-swatch[data-theme="noir-classic"] { background: linear-gradient(135deg, #000000 50%, #d4af37 50%); }

    .theme-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: -8px;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    @media (max-width: 700px) { .action-buttons { grid-template-columns: 1fr 1fr; } }

    .btn {
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
    }

    .btn-gold { background: var(--gold); color: #000; }
    .btn-gold:hover { background: var(--gold-hover); transform: translateY(-1px); }
    .btn-outline { background: transparent; color: #fff; border: 1px solid var(--border-color); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-parse { background: #2a3040; color: #fff; border: 1px solid var(--border-color); }
    .btn-parse:hover { background: #3a4055; border-color: var(--gold); }

    .preview-area {
      background: #000;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }

    .preview-area .scale-wrapper { width: 100%; height: 100%; position: relative; }

    /* ============================================================
       POSTER TEMPLATE — parchment / vintage plate-card style
       All colors resolve from the CSS variables below, which are
       redefined per [data-theme] so the whole poster restyles.
       ============================================================ */
    #poster-node {
      width: 800px;
      height: 800px;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      user-select: none;

      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 22px;
      border: 10px solid var(--pv-accent);
      background: var(--pv-bg);
      font-family: 'Playfair Display', serif;

      /* default theme: navy & gold */
      --pv-bg: #f3e8d1;
      --pv-accent: #182a40;
      --pv-accent-contrast: #f3e8d1;
      --pv-gold: #c9a13c;
      --pv-title: #182a40;
      --pv-author: #a9812f;
      --pv-card-bg: #faf4e5;
      --pv-card-border: #c9a13c;
      --pv-text: #2a2a28;
      --pv-label: #182a40;
    }

    #poster-node[data-theme="emerald-gold"] {
      --pv-bg: #f1ece0;
      --pv-accent: #173829;
      --pv-accent-contrast: #f1ece0;
      --pv-gold: #c9a13c;
      --pv-title: #173829;
      --pv-author: #a9862f;
      --pv-card-bg: #f7f3e6;
      --pv-card-border: #c9a13c;
      --pv-text: #232320;
      --pv-label: #173829;
    }

    #poster-node[data-theme="burgundy-gold"] {
      --pv-bg: #f4ece1;
      --pv-accent: #54101f;
      --pv-accent-contrast: #f4ece1;
      --pv-gold: #c9a13c;
      --pv-title: #54101f;
      --pv-author: #a9862f;
      --pv-card-bg: #faf2e6;
      --pv-card-border: #c9a13c;
      --pv-text: #241f1c;
      --pv-label: #54101f;
    }

    #poster-node[data-theme="sepia-brass"] {
      --pv-bg: #ede0c4;
      --pv-accent: #4a3420;
      --pv-accent-contrast: #ede0c4;
      --pv-gold: #9c7a35;
      --pv-title: #4a3420;
      --pv-author: #8a6a2e;
      --pv-card-bg: #f4ecd7;
      --pv-card-border: #9c7a35;
      --pv-text: #2c2418;
      --pv-label: #4a3420;
    }

    #poster-node[data-theme="noir-classic"] {
      --pv-bg: #121212;
      --pv-accent: #000000;
      --pv-accent-contrast: #d4af37;
      --pv-gold: #d4af37;
      --pv-title: #f5f5f5;
      --pv-author: #d4af37;
      --pv-card-bg: #1c1c1c;
      --pv-card-border: #d4af37;
      --pv-text: #e6e6e6;
      --pv-label: #d4af37;
    }

    .pv-ribbon-row {
      padding: 22px 40px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex: 0 0 auto;
    }

    .pv-flourish { flex: 0 0 auto; }
    .pv-flourish svg { display: block; width: 70px; height: 18px; }
    .pv-flourish path { stroke: var(--pv-gold); fill: none; stroke-width: 1.6; stroke-linecap: round; }
    .pv-flourish circle { fill: var(--pv-gold); }
    .pv-flourish.flip { transform: scaleX(-1); }

    .pv-badge {
      background: var(--pv-accent);
      color: var(--pv-accent-contrast);
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.09em;
      padding: 9px 24px;
      border-radius: 6px;
      border: 2px solid var(--pv-gold);
      white-space: nowrap;
    }

    .pv-title {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-weight: 800;
      color: var(--pv-title);
      font-size: 2.5rem;
      line-height: 1.08;
      margin: 16px 34px 6px;
      text-transform: uppercase;
      flex: 0 0 auto;
    }

    .pv-author-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
      flex: 0 0 auto;
    }

    .pv-author {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--pv-author);
      font-size: 1.3rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .pv-dot { color: var(--pv-gold); font-size: 1.3rem; }

    .pv-middle {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 250px 1fr;
      gap: 20px;
      padding: 6px 34px 16px;
    }

    .pv-card {
      background: var(--pv-card-bg);
      border: 1.5px solid var(--pv-card-border);
      border-radius: 14px;
      padding: 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      overflow: hidden;
      min-width: 0;
    }

    .pv-row { display: flex; gap: 9px; align-items: flex-start; min-width: 0; }

    .pv-icon {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--pv-accent);
      border: 2px solid var(--pv-gold);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pv-icon svg { width: 14px; height: 14px; }
    .pv-icon svg path, .pv-icon svg circle, .pv-icon svg rect {
      stroke: var(--pv-accent-contrast);
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pv-row-text { flex: 1; min-width: 0; }
    .pv-label {
      display: block;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--pv-label);
      font-size: 0.86rem;
    }

    .pv-value {
      display: block;
      font-family: 'Playfair Display', serif;
      color: var(--pv-text);
      font-size: 0.8rem;
      line-height: 1.32;
      word-break: break-word;
    }

    .pv-bullets {
      margin: 3px 0 0 0;
      padding-left: 15px;
      font-family: 'Playfair Display', serif;
      color: var(--pv-text);
      font-size: 0.76rem;
      line-height: 1.35;
    }

    .pv-bullets li { margin-bottom: 2px; }

    .pv-photo-frame {
      background: linear-gradient(135deg, var(--pv-gold), var(--pv-accent) 65%, var(--pv-gold));
      padding: 9px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      min-height: 0;
    }

    .pv-photo-inner {
      background: #0b0b0b;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 3px;
      min-height: 0;
    }

    .pv-photo-inner img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .pv-photo-inner .placeholder-icon { color: #555; font-size: 3rem; font-weight: 300; }

    .pv-banner {
      margin: 2px 34px 16px;
      background: var(--pv-accent);
      border: 1.5px solid var(--pv-gold);
      border-radius: 12px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 0 0 auto;
    }

    .pv-feather svg { display: block; width: 26px; height: 26px; }
    .pv-feather path { stroke: var(--pv-gold); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

    .pv-banner-text { flex: 1; text-align: center; min-width: 0; }
    .pv-banner-line1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--pv-accent-contrast);
      font-size: 1.02rem;
    }
    .pv-banner-line2 {
      font-family: 'Playfair Display', serif;
      color: var(--pv-accent-contrast);
      opacity: 0.85;
      font-size: 0.82rem;
      margin-top: 3px;
    }

    .pv-footer {
      background: var(--pv-accent);
      padding: 12px 30px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      flex: 0 0 auto;
    }

    .pv-code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      color: var(--pv-accent-contrast);
      font-size: 0.8rem;
      justify-self: start;
      opacity: 0.9;
    }

    .pv-handle-group { display: flex; align-items: center; gap: 12px; justify-self: center; }
    .pv-handle {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      color: var(--pv-accent-contrast);
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .pv-footer .pv-flourish svg { width: 44px; height: 12px; }

    .caption-panel {
      margin-top: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .caption-panel .caption-header { display: flex; justify-content: space-between; align-items: center; }
    .caption-panel .caption-header span { font-weight: 700; color: var(--gold); font-size: 0.85rem; }

    .caption-content {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      color: #d1d5db;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 170px;
      overflow-y: auto;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--gold);
      color: #000;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 10px 18px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
      z-index: 100;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 700px) {
      .app-header h1 { font-size: 1.1rem; }
      .controls { padding: 16px; }
      .pv-title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-header">
      <h1>📖 Book Studio</h1>
      <span class="tagline">Live Poster · Instagram Ready</span>
    </div>

    <div class="studio-grid">
      <div class="controls">
        <div class="group">
          <label>🎨 Theme</label>
          <div class="theme-swatches" id="themeSwatches">
            <div class="theme-swatch active" data-theme="navy-gold" title="Navy & Gold" onclick="setTheme('navy-gold')"></div>
            <div class="theme-swatch" data-theme="emerald-gold" title="Emerald & Gold" onclick="setTheme('emerald-gold')"></div>
            <div class="theme-swatch" data-theme="burgundy-gold" title="Burgundy & Gold" onclick="setTheme('burgundy-gold')"></div>
            <div class="theme-swatch" data-theme="sepia-brass" title="Sepia & Brass" onclick="setTheme('sepia-brass')"></div>
            <div class="theme-swatch" data-theme="noir-classic" title="Noir Classic" onclick="setTheme('noir-classic')"></div>
          </div>
          <div class="theme-label" id="themeLabel">Navy & Gold</div>
        </div>

        <div class="group">
          <label>📸 Cover Photo</label>
          <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <span id="uploadLabel">Click or drop image</span>
            <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleImage(event)" />
          </div>
        </div>

        <div class="group">
          <label>📚 Book Code</label>
          <input type="text" id="codeInput" value="FRB0009" placeholder="e.g. FRB0009" oninput="updatePoster()" />
        </div>

        <div class="group">
          <label>📝 Book Details</label>
          <textarea id="rawInput" placeholder="* Book Name: Tarzan at the Earth's Core&#10;* Author: Edgar Rice Burroughs&#10;* Publisher: Landsborough Publications Limited&#10;* Publication Date: 1959 (Four Square Edition)&#10;* Printing History: First published by Methuen & Co. Ltd. in 1938; Published as a Four Square Book in 1959&#10;* Series / Imprint: Four Square Books&#10;* Printed in: Great Britain by Love & Malcomson Ltd., London and Redhill, Surrey&#10;* Notes: Landsborough Publications Limited are from 173 New Bond Street, London, W.1." oninput="autoUpdate()"></textarea>
        </div>

        <div class="action-buttons">
          <button class="btn btn-parse" onclick="parseAndUpdate()">🔍 Parse & Update</button>
          <button class="btn btn-gold" onclick="downloadPoster()">⬇ Download</button>
          <button class="btn btn-outline" onclick="copyCaption()">📋 Copy Caption</button>
        </div>
        <div style="font-size:0.7rem; color:var(--text-muted); text-align:center; margin-top:-6px;">
          * Auto-updates on input, or click Parse for manual refresh
        </div>
      </div>

      <div class="preview-area">
        <div class="scale-wrapper" id="scaleWrapper">
          <div id="poster-node" data-theme="navy-gold">

            <div class="pv-ribbon-row">
              <span class="pv-flourish">
                <svg viewBox="0 0 80 20" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2 10c10-10 20 10 30 0s20-10 30 0" />
                  <circle cx="2" cy="10" r="2" />
                  <circle cx="62" cy="10" r="2" />
                </svg>
              </span>
              <div class="pv-badge">#FINDRAREBOOKS</div>
              <span class="pv-flourish flip">
                <svg viewBox="0 0 80 20" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2 10c10-10 20 10 30 0s20-10 30 0" />
                  <circle cx="2" cy="10" r="2" />
                  <circle cx="62" cy="10" r="2" />
                </svg>
              </span>
            </div>

            <h1 class="pv-title" id="posterTitle">UNTITLED</h1>

            <div class="pv-author-row">
              <span class="pv-dot">•</span>
              <span class="pv-author" id="posterAuthor"></span>
              <span class="pv-dot">•</span>
            </div>

            <div class="pv-middle">
              <div class="pv-card" id="cardLeft"></div>

              <div class="pv-photo-frame">
                <div class="pv-photo-inner">
                  <img id="coverImg" src="" alt="Cover" style="display:none;" />
                  <span class="placeholder-icon" id="placeholderIcon">📷</span>
                </div>
              </div>

              <div class="pv-card" id="cardRight"></div>
            </div>

            <div class="pv-banner">
              <span class="pv-feather">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 4c-6 0-14 4-16 14 3-2 6-3 9-3-1 2-2 4-2 6 4-1 9-6 9-13z" />
                  <path d="M4 20l6-6" />
                </svg>
              </span>
              <div class="pv-banner-text">
                <div class="pv-banner-line1" id="bannerLine1"></div>
                <div class="pv-banner-line2" id="bannerLine2"></div>
              </div>
            </div>

            <div class="pv-footer">
              <span class="pv-code" id="footerCode">Book Code: FRB0009</span>
              <span class="pv-handle-group">
                <span class="pv-flourish">
                  <svg viewBox="0 0 80 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 10c10-10 20 10 30 0s20-10 30 0" />
                    <circle cx="2" cy="10" r="2" />
                    <circle cx="62" cy="10" r="2" />
                  </svg>
                </span>
                <span class="pv-handle">@findrarebooks</span>
                <span class="pv-flourish flip">
                  <svg viewBox="0 0 80 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 10c10-10 20 10 30 0s20-10 30 0" />
                    <circle cx="2" cy="10" r="2" />
                    <circle cx="62" cy="10" r="2" />
                  </svg>
                </span>
              </span>
              <span></span>
            </div>

          </div>
        </div>
      </div>
    </div>

    <div class="caption-panel">
      <div class="caption-header">
        <span>✨ Instagram Post</span>
        <button class="btn btn-outline" style="padding:4px 12px; font-size:0.7rem;" onclick="copyCaption()">📋 Copy</button>
      </div>
      <div class="caption-content" id="captionOutput">Loading caption...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============================================================
    // DOM references
    const rawInput = document.getElementById('rawInput');
    const codeInput = document.getElementById('codeInput');
    const coverImg = document.getElementById('coverImg');
    const placeholderIcon = document.getElementById('placeholderIcon');
    const posterTitle = document.getElementById('posterTitle');
    const posterAuthor = document.getElementById('posterAuthor');
    const cardLeft = document.getElementById('cardLeft');
    const cardRight = document.getElementById('cardRight');
    const bannerLine1 = document.getElementById('bannerLine1');
    const bannerLine2 = document.getElementById('bannerLine2');
    const footerCode = document.getElementById('footerCode');
    const captionOutput = document.getElementById('captionOutput');
    const uploadZone = document.getElementById('uploadZone');
    const uploadLabel = document.getElementById('uploadLabel');
    const scaleWrapper = document.getElementById('scaleWrapper');
    const posterNode = document.getElementById('poster-node');
    const toast = document.getElementById('toast');
    const themeLabel = document.getElementById('themeLabel');

    let coverDataUrl = null;
    let lastCaption = '';

    const THEME_NAMES = {
      'navy-gold': 'Navy & Gold',
      'emerald-gold': 'Emerald & Gold',
      'burgundy-gold': 'Burgundy & Gold',
      'sepia-brass': 'Sepia & Brass',
      'noir-classic': 'Noir Classic'
    };

    // ---- Icon library (simple line SVGs, colored via CSS) ----
    const ICONS = {
      book: '<path d="M3 5h6a2 2 0 0 1 2 2v11a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a2 2 0 0 0-2 2v11a2 2 0 0 1 2-2h6z"/>',
      person: '<circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.2-3.5 4-5 7-5s5.8 1.5 7 5"/>',
      building: '<path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-6h6v6"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      stack: '<rect x="4" y="5" width="16" height="4" rx="1"/><rect x="4" y="10" width="16" height="4" rx="1"/><rect x="4" y="15" width="16" height="4" rx="1"/>',
      globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18"/><path d="M12 3c-3 3-3 15 0 18"/>'
    };

    function iconSvg(name) {
      return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${ICONS[name] || ICONS.book}</svg>`;
    }

    // ---- Theme switching ----
    function setTheme(theme) {
      posterNode.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-swatch').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-theme') === theme);
      });
      themeLabel.textContent = THEME_NAMES[theme] || theme;
    }

    // ---- Parser ----
    const EMPTY_VALUES = new Set(['n/a', 'na', 'none', '-', '--', 'nil', 'null', 'unknown']);

    function parseBookText(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const data = {};
      for (let line of lines) {
        line = line.replace(/^[\s*•\-\u2022]+/, '').replace(/^\d+[.)]\s*/, '').trim();
        const idx = line.indexOf(':');
        if (idx !== -1) {
          const key = line.substring(0, idx).trim().toLowerCase();
          let val = line.substring(idx + 1).trim();
          if (EMPTY_VALUES.has(val.toLowerCase())) val = '';
          if (key && val) data[key] = val;
        }
      }
      const get = (aliases) => {
        for (const a of aliases) {
          if (data[a.toLowerCase()]) return data[a.toLowerCase()];
        }
        return '';
      };
      let title = get(['book name', 'title', 'book', 'name']);
      if (!title) {
        let first = (text.split('\n')[0] || '').replace(/^[\s*•\-\u2022]+/, '').trim();
        if (first.length < 80 && !first.includes(':')) title = first.trim();
      }
      return {
        title: title,
        author: get(['author', 'translator', 'writer', 'by']),
        publisher: get(['publisher', 'published by', 'press']),
        date: get(['publication date', 'year', 'date', 'published']),
        binding: get(['binding', 'format', 'cover']),
        condition: get(['condition', 'state']),
        edition: get(['edition', 'impression']),
        printedIn: get(['printed in', 'printed', 'country', 'origin']),
        notes: get(['notes', 'note', 'description', 'details']),
        printingHistory: get(['printing history', 'print history', 'history']),
        series: get(['series', 'imprint', 'series / imprint'])
      };
    }

    // ---- Card row builder ----
    function buildRow(icon, label, value) {
      const row = document.createElement('div');
      row.className = 'pv-row';
      row.innerHTML = `
        <span class="pv-icon">${iconSvg(icon)}</span>
        <div class="pv-row-text">
          <span class="pv-label">${label}:</span>
          <span class="pv-value"></span>
        </div>`;
      row.querySelector('.pv-value').textContent = value;
      return row;
    }

    function buildBulletRow(icon, label, bullets) {
      const row = document.createElement('div');
      row.className = 'pv-row';
      const ul = document.createElement('ul');
      ul.className = 'pv-bullets';
      bullets.forEach(b => {
        const li = document.createElement('li');
        li.textContent = b;
        ul.appendChild(li);
      });
      row.innerHTML = `
        <span class="pv-icon">${iconSvg(icon)}</span>
        <div class="pv-row-text">
          <span class="pv-label">${label}:</span>
        </div>`;
      row.querySelector('.pv-row-text').appendChild(ul);
      return row;
    }

    // ---- Main update function ----
    function updatePoster() {
      const text = rawInput.value.trim();
      const code = codeInput.value.trim() || 'Book Code';
      const parsed = parseBookText(text);

      let fullTitle = parsed.title || 'UNTITLED';
      let displayTitle = fullTitle;
      if (fullTitle.includes('/')) displayTitle = fullTitle.split('/')[1].trim();
      if (!displayTitle) displayTitle = fullTitle;

      let author = parsed.author || '';
      let displayAuthor = author.replace(/\(.*?\)/g, '').trim();

      posterTitle.textContent = displayTitle.toUpperCase();
      posterAuthor.textContent = displayAuthor.toUpperCase();

      // Shrink title font for long titles so it never overruns the ribbon area
      if (displayTitle.length > 55) {
        posterTitle.style.fontSize = '1.5rem';
      } else if (displayTitle.length > 38) {
        posterTitle.style.fontSize = '1.9rem';
      } else if (displayTitle.length > 24) {
        posterTitle.style.fontSize = '2.2rem';
      } else {
        posterTitle.style.fontSize = '2.5rem';
      }

      // ---- Left card: core bibliographic facts ----
      cardLeft.innerHTML = '';
      if (fullTitle) cardLeft.appendChild(buildRow('book', 'Title', fullTitle));
      if (author) cardLeft.appendChild(buildRow('person', 'Author', author));
      if (parsed.publisher) cardLeft.appendChild(buildRow('building', 'Publisher', parsed.publisher));
      if (parsed.date) cardLeft.appendChild(buildRow('calendar', 'Publication Date', parsed.date));

      // ---- Right card: printing history / series / origin ----
      cardRight.innerHTML = '';
      let historyBullets = [];
      if (parsed.printingHistory) {
        historyBullets = parsed.printingHistory.split(/;|\n/).map(s => s.trim()).filter(Boolean);
      } else {
        [
          parsed.edition && `${parsed.edition} edition`,
          parsed.binding && `${parsed.binding} binding`,
          parsed.condition && `Condition: ${parsed.condition}`
        ].filter(Boolean).forEach(b => historyBullets.push(b));
      }
      if (historyBullets.length) cardRight.appendChild(buildBulletRow('clock', 'Printing History', historyBullets));
      if (parsed.series) cardRight.appendChild(buildRow('stack', 'Series / Imprint', parsed.series));
      if (parsed.printedIn) cardRight.appendChild(buildRow('globe', 'Printed in', parsed.printedIn));

      // ---- Bottom banner ----
      bannerLine1.textContent = fullTitle;
      if (parsed.notes) {
        bannerLine2.textContent = parsed.notes;
        bannerLine2.style.display = 'block';
      } else {
        bannerLine2.textContent = '';
        bannerLine2.style.display = 'none';
      }

      footerCode.textContent = code.toLowerCase().startsWith('book code:') ? code : `Book Code: ${code}`;

      if (!coverDataUrl) {
        coverImg.style.display = 'none';
        placeholderIcon.style.display = 'block';
      } else {
        coverImg.style.display = 'block';
        placeholderIcon.style.display = 'none';
      }

      generateCaption(fullTitle, author, parsed, code);
    }

    // ---- Caption generator ----
    function generateCaption(title, author, parsed, code) {
      const cleanTag = (s) => s.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
      const titleTag = cleanTag(title.split('/')[0]);
      const authorTag = cleanTag(author);

      const lines = [];
      lines.push(`📖 Rare Vintage Collectible: ${title}`);
      lines.push('');
      let introLine = '';
      if (parsed.publisher) introLine += `Published by ${parsed.publisher}`;
      if (parsed.date) introLine += ` (${parsed.date})`;
      if (parsed.edition) introLine += `, ${parsed.edition}`;
      if (introLine) introLine += '. ';
      introLine += 'A significant piece for bibliophiles and collectors.';
      lines.push(introLine);
      lines.push('');
      lines.push('---');
      lines.push('');
      lines.push('📋 Bibliographical Details:');
      lines.push(`• Title: ${title}`);
      if (author) lines.push(`• Author/Translator: ${author}`);
      if (parsed.publisher) lines.push(`• Publisher: ${parsed.publisher}`);
      if (parsed.date) lines.push(`• Year: ${parsed.date}`);
      if (parsed.edition) lines.push(`• Edition: ${parsed.edition}`);
      if (parsed.binding) lines.push(`• Binding: ${parsed.binding}`);
      if (parsed.condition) lines.push(`• Condition: ${parsed.condition}`);
      if (parsed.series) lines.push(`• Series/Imprint: ${parsed.series}`);
      if (parsed.printingHistory) lines.push(`• Printing History: ${parsed.printingHistory}`);
      if (parsed.printedIn) lines.push(`• Origin: Printed in ${parsed.printedIn}`);
      if (parsed.notes) lines.push(`• Notes: ${parsed.notes}`);
      lines.push(`• Inventory Code: ${code || 'Available on request'}`);
      lines.push('');
      lines.push('---');
      lines.push('');
      lines.push('📩 DM us directly to claim or purchase.');
      lines.push('');
      lines.push('.');
      lines.push('.');
      lines.push(`#findrarebooks #rarebooks #vintagebooks #${authorTag} #${titleTag} #firstedition #bookcollecting #oldbooks #ukeditions #paperbackcollector`);

      lastCaption = lines.join('\n');
      captionOutput.textContent = lastCaption;
    }

    // ---- Image upload ----
    function handleImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        coverDataUrl = e.target.result;
        coverImg.src = coverDataUrl;
        coverImg.style.display = 'block';
        placeholderIcon.style.display = 'none';
        uploadZone.classList.add('loaded');
        uploadLabel.textContent = '✅ Photo loaded';
        updatePoster();
      };
      reader.readAsDataURL(file);
    }

    // ---- Parse & Update (button) ----
    function parseAndUpdate() {
      updatePoster();
      const btn = document.querySelector('.btn-parse');
      btn.style.background = '#3a8b5c';
      setTimeout(() => { btn.style.background = ''; }, 300);
    }

    // ---- Auto-update on input ----
    function autoUpdate() {
      clearTimeout(window._autoTimer);
      window._autoTimer = setTimeout(updatePoster, 200);
    }

    // ---- Toast helper ----
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // ---- Copy caption ----
    function copyCaption() {
      if (!lastCaption) { showToast('Nothing to copy yet'); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastCaption)
          .then(() => showToast('Caption copied!'))
          .catch(() => fallbackCopy(lastCaption));
      } else {
        fallbackCopy(lastCaption);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Caption copied!');
      } catch (err) {
        showToast('Copy failed — select manually');
      }
      document.body.removeChild(ta);
    }

    // ---- Download ----
    function downloadPoster() {
      const originalTransform = posterNode.style.transform;
      posterNode.style.transform = 'none';

      html2canvas(posterNode, {
        scale: 2.5,
        useCORS: true,
        allowTaint: true,
        backgroundColor: null,
        width: 800,
        height: 800
      }).then(canvas => {
        posterNode.style.transform = originalTransform;
        const codeVal = (codeInput.value.trim() || 'poster').replace(/[^a-zA-Z0-9_-]/g, '');
        const a = document.createElement('a');
        a.download = `${codeVal || 'Poster'}_${Date.now()}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
        showToast('Poster downloaded!');
      }).catch((err) => {
        posterNode.style.transform = originalTransform;
        console.error('Poster export failed:', err);
        showToast('Download failed — try again');
      });
    }

    // ---- Scale the 800x800 poster node to fit the preview box ----
    function scalePreview() {
      const boxWidth = scaleWrapper.clientWidth;
      const boxHeight = scaleWrapper.clientHeight;
      const scale = Math.min(boxWidth / 800, boxHeight / 800);
      posterNode.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', scalePreview);

    // ---- Init ----
    function init() {
      scalePreview();
      updatePoster();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
