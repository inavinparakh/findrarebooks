<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rare Books Poster & Instagram Studio</title>

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg: #0d0f14;
      --card: #161922;
      --accent: #d4af37;
      --accent-hover: #b8972e;
      --border: #262b3a;
      --text: #ffffff;
      --muted: #8e95a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      min-height: 100vh;
    }

    .app-box {
      max-width: 850px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .top-bar h1 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
    }

    .grid-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .upload-btn {
      background: #0f1118;
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
    }

    .upload-btn.loaded {
      border-color: #22c55e;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.08);
      font-weight: 700;
    }

    .input-code {
      background: #0f1118;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
    }

    .input-code:focus {
      border-color: var(--accent);
    }

    .text-area {
      width: 100%;
      background: #0f1118;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.82rem;
      font-family: inherit;
      min-height: 90px;
      resize: vertical;
      line-height: 1.35;
      outline: none;
    }

    .text-area:focus {
      border-color: var(--accent);
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-download {
      background: var(--accent);
      color: #000;
    }

    .btn-copy {
      background: #232838;
      color: #fff;
      border: 1px solid var(--border);
    }

    .preview-box {
      background: #000;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .scale-box {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      position: relative;
    }

    #poster-node {
      width: 800px;
      height: 800px;
      background: #000000;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    .poster-body {
      display: flex;
      width: 100%;
      height: 736px;
      background: #000000;
    }

    .poster-left {
      width: 65%;
      height: 100%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .poster-left img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 10px 28px rgba(0,0,0,0.9);
    }

    .poster-left .placeholder {
      color: #555;
      font-size: 3rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .poster-right {
      width: 35%;
      height: 100%;
      background: #ffffff;
      color: #111111;
      padding: 28px 18px 16px 18px;
      display: flex;
      flex-direction: column;
      font-family: 'Playfair Display', serif;
      box-sizing: border-box;
      border-left: 1px solid #eaeaea;
    }

    .poster-head {
      text-align: center;
      margin-bottom: 12px;
    }

    .poster-title {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.22;
      text-transform: uppercase;
      color: #111111;
    }

    .poster-author {
      font-size: 0.88rem;
      letter-spacing: 0.05em;
      font-weight: 600;
      text-transform: uppercase;
      color: #333333;
      margin-top: 6px;
    }

    .poster-line {
      width: 100%;
      height: 1px;
      background: #c2c2c2;
      margin: 12px 0;
    }

    .poster-meta {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
      justify-content: flex-start;
      font-size: 0.80rem;
      line-height: 1.28;
      overflow: hidden;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      align-items: baseline;
      column-gap: 6px;
    }

    .meta-label {
      font-weight: 700;
      color: #111111;
    }

    .meta-value {
      font-weight: 400;
      color: #222222;
      word-break: break-word;
    }

    .poster-bar {
      height: 64px;
      width: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-sizing: border-box;
      border-top: 1px solid #dcdcdc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .bar-code {
      font-size: 1.2rem;
      font-weight: 800;
      color: #000000;
    }

    .bar-branding {
      font-size: 1.2rem;
      font-weight: 800;
      color: #000000;
    }

    .caption-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .caption-content {
      background: #0f1118;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: #d1d5db;
      font-size: 0.8rem;
      line-height: 1.45;
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
    }

    @media (max-width: 550px) {
      .grid-inputs {
        grid-template-columns: 1fr;
      }
      .actions-grid {
        grid-template-columns: 1fr;
      }
      .poster-right {
        padding: 16px 12px;
      }
      .poster-title {
        font-size: 1rem;
      }
      .poster-author {
        font-size: 0.75rem;
      }
      .meta-row {
        grid-template-columns: 70px 1fr;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-box">
    <!-- Input Panel -->
    <div class="panel">
      <div class="top-bar">
        <h1>📖 Book Studio</h1>
        <span style="font-size: 0.72rem; color: var(--muted);">Live Generator</span>
      </div>

      <div class="grid-inputs">
        <div class="upload-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()">
          <span id="uploadLabel">📷 Upload Cover Photo</span>
          <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleImage(event)">
        </div>
        <input type="text" id="codeField" class="input-code" value="Book Code: FRB0009" placeholder="Book Code: FRB0009" oninput="runUpdate()" />
      </div>

      <textarea id="rawInput" class="text-area" placeholder="Paste book description here..." oninput="runUpdate()"></textarea>

      <div class="actions-grid">
        <button class="btn btn-download" onclick="exportPoster()">📥 Download Poster (PNG)</button>
        <button class="btn btn-copy" onclick="copyCaption()">📋 Copy Instagram Post</button>
      </div>
    </div>

    <!-- Poster Preview -->
    <div class="preview-box">
      <div class="scale-box" id="scaleBox">
        <div id="poster-node">
          <div class="poster-body">
            <div class="poster-left" id="coverContainer">
              <img id="viewCover" src="" alt="Book Cover" style="display:none;" />
              <div class="placeholder" id="placeholderText">📷</div>
            </div>

            <div class="poster-right">
              <div class="poster-head">
                <div class="poster-title" id="viewTitle">THE GOSPELS</div>
                <div class="poster-author" id="viewAuthor">JAMES MOFFATT</div>
              </div>
              <div class="poster-line"></div>
              <div class="poster-meta" id="viewMetaList"></div>
            </div>
          </div>

          <div class="poster-bar">
            <div class="bar-code" id="viewCode">Book Code: FRB0009</div>
            <div class="bar-branding">#findrarebooks</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Caption Panel -->
    <div class="caption-panel">
      <span style="font-size:0.8rem; font-weight:700; color:var(--accent);">✨ Instagram Ready Post</span>
      <div class="caption-content" id="viewCaption">Caption loading...</div>
    </div>
  </div>

  <script>
    // =========================================================
    // IMPROVED PARSER
    // =========================================================
    function parseBookText(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const data = {};

      for (const line of lines) {
        const colonIdx = line.indexOf(':');
        if (colonIdx !== -1) {
          const key = line.substring(0, colonIdx).trim().toLowerCase();
          const val = line.substring(colonIdx + 1).trim();
          if (key && val) {
            data[key] = val;
          }
        }
      }

      const getVal = (aliases) => {
        for (const a of aliases) {
          const val = data[a.toLowerCase()];
          if (val) return val;
        }
        return '';
      };

      // If no title found, use the first line (without colon) as title
      let title = getVal(['book name', 'title', 'book', 'name']);
      if (!title) {
        const firstLine = text.split('\n')[0] || '';
        if (firstLine.length < 80 && !firstLine.includes(':')) {
          title = firstLine.trim();
        }
      }

      return {
        title: title,
        author: getVal(['author', 'translator', 'writer', 'by']),
        publisher: getVal(['publisher', 'published by', 'press']),
        date: getVal(['publication date', 'year', 'date', 'published']),
        binding: getVal(['binding', 'format', 'cover']),
        condition: getVal(['condition', 'state']),
        edition: getVal(['edition', 'impression']),
        printedIn: getVal(['printed in', 'printed', 'country', 'origin']),
        notes: getVal(['notes', 'note', 'description', 'details'])
      };
    }

    // =========================================================
    // MAIN UPDATE FUNCTION
    // =========================================================
    function runUpdate() {
      const text = document.getElementById('rawInput').value.trim();
      const codeVal = document.getElementById('codeField').value.trim();
      const parsed = parseBookText(text);

      // ---- HEADER ----
      let fullTitle = parsed.title || 'VINTAGE BOOK';
      let headerTitle = fullTitle;
      if (fullTitle.includes('/')) {
        headerTitle = fullTitle.split('/')[1].trim();
      }
      if (!headerTitle) headerTitle = fullTitle;

      let author = parsed.author || '';
      let headerAuthor = author.replace(/\(.*?\)/g, '').trim();

      document.getElementById('viewTitle').innerText = headerTitle.toUpperCase();
      document.getElementById('viewAuthor').innerText = headerAuthor.toUpperCase();

      // ---- META TABLE ----
      const rows = [
        ['Title', fullTitle],
        ['Author', author],
        ['Publisher', parsed.publisher],
        ['Publication Date', parsed.date],
        ['Binding', parsed.binding],
        ['Condition', parsed.condition || ''],   // empty if not provided
        ['Edition', parsed.edition],
        ['Printed in', parsed.printedIn],
        ['Notes', parsed.notes]
      ].filter(row => row[1]);

      const container = document.getElementById('viewMetaList');
      container.innerHTML = '';

      let totalChars = 0;
      for (const [label, value] of rows) {
        if (value) {
          totalChars += value.length;
          const row = document.createElement('div');
          row.className = 'meta-row';
          row.innerHTML = `<span class="meta-label">${label}</span><span class="meta-value">${value}</span>`;
          container.appendChild(row);
        }
      }

      // ---- DYNAMIC FONT SIZE ----
      if (totalChars > 340) {
        container.style.fontSize = '0.70rem';
        container.style.gap = '4px';
      } else if (totalChars > 230) {
        container.style.fontSize = '0.76rem';
        container.style.gap = '6px';
      } else {
        container.style.fontSize = '0.80rem';
        container.style.gap = '7px';
      }

      // ---- BOOK CODE ----
      document.getElementById('viewCode').innerText = codeVal || 'Book Code';

      // ---- COVER PLACEHOLDER ----
      const img = document.getElementById('viewCover');
      const placeholder = document.getElementById('placeholderText');
      if (!img.src || img.style.display === 'none') {
        placeholder.style.display = 'block';
      } else {
        placeholder.style.display = 'none';
      }

      // ---- CAPTION ----
      buildCaption(fullTitle, headerAuthor, rows, codeVal);
    }

    // =========================================================
    // CAPTION GENERATOR
    // =========================================================
    function buildCaption(title, author, rows, code) {
      const getV = (key) => {
        const found = rows.find(r => r[0].toLowerCase() === key.toLowerCase());
        return found ? found[1] : '';
      };

      const publisher = getV('Publisher');
      const year = getV('Publication Date');
      const edition = getV('Edition');
      const binding = getV('Binding');
      const condition = getV('Condition');
      const printedIn = getV('Printed in');
      const notes = getV('Notes');

      const tagClean = str => str ? str.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() : '';
      const tTag = tagClean(title.split('/')[0]);
      const aTag = tagClean(author);

      let conditionLine = condition ? `• Condition: ${condition}` : '';
      let notesLine = notes ? `• Historical Notes: ${notes}` : '';

      const caption = `📖 Rare Vintage Collectible: ${title}

${publisher ? `Published by ${publisher}` : ''}${year ? ` (${year})` : ''}${edition ? `, ${edition}` : ''}. A significant piece for bibliophiles and collectors.

---

📋 Bibliographical Details:
• Title: ${title}
• Author/Translator: ${author}
${publisher ? `• Publisher: ${publisher}` : ''}
${year ? `• Year: ${year}` : ''}
${edition ? `• Edition: ${edition}` : ''}
${binding ? `• Binding: ${binding}` : ''}
${conditionLine}
${printedIn ? `• Origin: Printed in ${printedIn}` : ''}
${notesLine}
• Inventory Code: ${code || 'Available on request'}

---

📩 DM us directly to claim or purchase.

.
.
#findrarebooks #rarebooks #vintagebooks #${aTag} #${tTag} #firstedition #bookcollecting #oldbooks #ukeditions #paperbackcollector`;

      document.getElementById('viewCaption').innerText = caption;
    }

    // =========================================================
    // IMAGE UPLOAD
    // =========================================================
    function handleImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('viewCover');
          img.src = e.target.result;
          img.style.display = 'block';
          const btn = document.getElementById('uploadBtn');
          btn.classList.add('loaded');
          document.getElementById('uploadLabel').innerText = '✅ Photo Loaded';
          // hide placeholder
          document.getElementById('placeholderText').style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    }

    // =========================================================
    // COPY CAPTION
    // =========================================================
    function copyCaption() {
      const text = document.getElementById('viewCaption').innerText;
      if (!text || text === 'Caption loading...') {
        alert('Please generate the poster first.');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        alert('✅ Instagram Post Copied!');
      }).catch(() => {
        alert('❌ Could not copy. Please select and copy manually.');
      });
    }

    // =========================================================
    // EXPORT POSTER (HIGH-RES)
    // =========================================================
    function exportPoster() {
      const poster = document.getElementById('poster-node');
      const originalTransform = poster.style.transform;
      poster.style.transform = 'none';

      html2canvas(poster, {
        scale: 3, // higher resolution
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#000000',
        width: 800,
        height: 800
      }).then(canvas => {
        poster.style.transform = originalTransform;
        const a = document.createElement('a');
        a.download = `Poster_${Date.now()}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      }).catch(() => {
        poster.style.transform = originalTransform;
        alert('❌ Download failed. Please try again.');
      });
    }

    // =========================================================
    // SCALING: keep poster 800px node scaled inside container
    // =========================================================
    function autoScale() {
      const box = document.getElementById('scaleBox');
      const node = document.getElementById('poster-node');
      const w = box.clientWidth;
      if (w > 0) {
        node.style.transform = `scale(${w / 800})`;
      }
    }

    // Use ResizeObserver for better responsiveness
    const ro = new ResizeObserver(autoScale);
    ro.observe(document.getElementById('scaleBox'));

    // =========================================================
    // INIT
    // =========================================================
    // Load default example data
    const defaultText = `Book Name: The Moffatt Translation of the Gospels / The Gospels
    Author: James Moffatt (Translator)
    Publisher: Hodder and Stoughton
    Year: 1959
    Binding: Paperback
    Condition: Very Good
    Edition: First Paperback Edition
    Printed in: England
    Notes: First published in this form 1959; original price 2/6 net; printed and bound by Hazell Watson and Viney Ltd.`;

    document.getElementById('rawInput').value = defaultText;
    runUpdate();
    setTimeout(autoScale, 150);
  </script>
</body>
</html>
