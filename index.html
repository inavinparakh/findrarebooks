<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Book Poster Studio · Find Rare Books</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-body: #0b0d11;
      --bg-card: #14171e;
      --bg-input: #0f1118;
      --border-color: #262b3a;
      --gold: #d4af37;
      --gold-hover: #b8972e;
      --text-light: #ffffff;
      --text-muted: #8e95a5;
      --radius: 12px;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-body);
      color: var(--text-light);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      max-width: 1200px;
      width: 100%;
    }

    /* ---- HEADER ---- */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .app-header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--gold);
      font-family: 'Cinzel', serif;
    }

    .app-header .tagline {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ---- TWO-COLUMN LAYOUT ---- */
    .studio-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .studio-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ---- LEFT: CONTROLS ---- */
    .controls {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .controls .group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .controls .group label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .controls .group input,
    .controls .group textarea {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.85rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      outline: none;
      transition: 0.2s;
      width: 100%;
      resize: vertical;
    }

    .controls .group textarea {
      min-height: 100px;
      line-height: 1.4;
    }

    .controls .group input:focus,
    .controls .group textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
    }

    .upload-zone {
      background: var(--bg-input);
      border: 1.5px dashed var(--border-color);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .upload-zone:hover {
      border-color: var(--gold);
      background: #1a1e2a;
    }

    .upload-zone.loaded {
      border-color: #22c55e;
      color: #22c55e;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
    }

    .btn-gold {
      background: var(--gold);
      color: #000;
    }

    .btn-gold:hover {
      background: var(--gold-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: #fff;
      border: 1px solid var(--border-color);
    }

    .btn-outline:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ---- RIGHT: PREVIEW ---- */
    .preview-area {
      background: #000;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }

    .preview-area .scale-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #poster-node {
      width: 800px;
      height: 800px;
      background: #000;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Poster internal layout */
    .poster-body {
      display: flex;
      width: 100%;
      height: 736px; /* 800 - 64 footer */
    }

    .poster-left {
      width: 65%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .poster-left img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.9);
    }

    .poster-left .placeholder-icon {
      color: #444;
      font-size: 4rem;
      font-weight: 300;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .poster-right {
      width: 35%;
      height: 100%;
      background: #fdfcf7;
      color: #111;
      padding: 26px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      font-family: 'Playfair Display', serif;
      border-left: 1px solid #ddd;
    }

    .poster-head {
      text-align: center;
      border-bottom: 1px solid #ccc;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .poster-title {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
      color: #111;
    }

    .poster-author {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #333;
      margin-top: 4px;
      letter-spacing: 0.04em;
    }

    .poster-meta {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.75rem;
      line-height: 1.3;
      overflow: hidden;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 80px 1fr;
      align-items: baseline;
      gap: 4px;
    }

    .meta-label {
      font-weight: 700;
      color: #111;
    }

    .meta-value {
      color: #222;
      word-break: break-word;
    }

    .poster-footer {
      height: 64px;
      background: #fdfcf7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-top: 1px solid #ddd;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .poster-footer .code {
      font-weight: 800;
      font-size: 1.1rem;
      color: #000;
    }

    .poster-footer .brand {
      font-weight: 800;
      font-size: 1.1rem;
      color: #000;
    }

    /* ---- CAPTION PANEL ---- */
    .caption-panel {
      margin-top: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .caption-panel .caption-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .caption-panel .caption-header span {
      font-weight: 700;
      color: var(--gold);
      font-size: 0.85rem;
    }

    .caption-content {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      color: #d1d5db;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 170px;
      overflow-y: auto;
    }

    /* ---- RESPONSIVE TWEAKS ---- */
    @media (max-width: 700px) {
      .app-header h1 {
        font-size: 1.1rem;
      }
      .controls {
        padding: 16px;
      }
      .action-buttons {
        grid-template-columns: 1fr;
      }
      .poster-right {
        padding: 16px 10px;
      }
      .poster-title {
        font-size: 0.9rem;
      }
      .poster-author {
        font-size: 0.7rem;
      }
      .meta-row {
        grid-template-columns: 60px 1fr;
        font-size: 0.65rem;
      }
      .poster-footer .code,
      .poster-footer .brand {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <div class="app-header">
      <h1>📖 Book Studio</h1>
      <span class="tagline">Live Poster · Instagram Ready</span>
    </div>

    <!-- MAIN GRID -->
    <div class="studio-grid">
      <!-- LEFT CONTROLS -->
      <div class="controls">
        <div class="group">
          <label>📸 Cover Photo</label>
          <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <span id="uploadLabel">Click or drop image</span>
            <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleImage(event)" />
          </div>
        </div>

        <div class="group">
          <label>📚 Book Code</label>
          <input type="text" id="codeInput" value="FRB00011" placeholder="e.g. FRB00011" oninput="updatePoster()" />
        </div>

        <div class="group">
          <label>📝 Book Details (paste raw text)</label>
          <textarea id="rawInput" placeholder="Paste your book description here..." oninput="updatePoster()"></textarea>
        </div>

        <div class="action-buttons">
          <button class="btn btn-gold" onclick="downloadPoster()">⬇ Download PNG</button>
          <button class="btn btn-outline" onclick="copyCaption()">📋 Copy Caption</button>
        </div>
      </div>

      <!-- RIGHT POSTER PREVIEW -->
      <div class="preview-area">
        <div class="scale-wrapper" id="scaleWrapper">
          <div id="poster-node">
            <div class="poster-body">
              <div class="poster-left" id="coverContainer">
                <img id="coverImg" src="" alt="Cover" style="display:none;" />
                <span class="placeholder-icon" id="placeholderIcon">📷</span>
              </div>
              <div class="poster-right">
                <div class="poster-head">
                  <div class="poster-title" id="posterTitle">THE GOSPELS</div>
                  <div class="poster-author" id="posterAuthor">JAMES MOFFATT</div>
                </div>
                <div class="poster-meta" id="posterMeta"></div>
              </div>
            </div>
            <div class="poster-footer">
              <span class="code" id="footerCode">Book Code: FRB00011</span>
              <span class="brand">#findrarebooks</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- CAPTION PANEL -->
    <div class="caption-panel">
      <div class="caption-header">
        <span>✨ Instagram Post</span>
        <button class="btn btn-outline" style="padding:4px 12px; font-size:0.7rem;" onclick="copyCaption()">📋 Copy</button>
      </div>
      <div class="caption-content" id="captionOutput">Loading caption...</div>
    </div>
  </div>

  <script>
    // ============================================================
    // CORE LOGIC
    // ============================================================

    // ---- DOM refs ----
    const rawInput = document.getElementById('rawInput');
    const codeInput = document.getElementById('codeInput');
    const coverImg = document.getElementById('coverImg');
    const placeholderIcon = document.getElementById('placeholderIcon');
    const posterTitle = document.getElementById('posterTitle');
    const posterAuthor = document.getElementById('posterAuthor');
    const posterMeta = document.getElementById('posterMeta');
    const footerCode = document.getElementById('footerCode');
    const captionOutput = document.getElementById('captionOutput');
    const uploadZone = document.getElementById('uploadZone');
    const uploadLabel = document.getElementById('uploadLabel');

    // ---- State ----
    let coverDataUrl = null;

    // ---- Parser ----
    function parseBookText(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const data = {};
      for (const line of lines) {
        const idx = line.indexOf(':');
        if (idx !== -1) {
          const key = line.substring(0, idx).trim().toLowerCase();
          const val = line.substring(idx + 1).trim();
          if (key && val) data[key] = val;
        }
      }
      const get = (aliases) => {
        for (const a of aliases) {
          if (data[a.toLowerCase()]) return data[a.toLowerCase()];
        }
        return '';
      };
      let title = get(['book name', 'title', 'book', 'name']);
      if (!title) {
        const first = text.split('\n')[0] || '';
        if (first.length < 80 && !first.includes(':')) title = first.trim();
      }
      return {
        title: title,
        author: get(['author', 'translator', 'writer', 'by']),
        publisher: get(['publisher', 'published by', 'press']),
        date: get(['publication date', 'year', 'date', 'published']),
        binding: get(['binding', 'format', 'cover']),
        condition: get(['condition', 'state']),
        edition: get(['edition', 'impression']),
        printedIn: get(['printed in', 'printed', 'country', 'origin']),
        notes: get(['notes', 'note', 'description', 'details'])
      };
    }

    // ---- Main update ----
    function updatePoster() {
      const text = rawInput.value.trim();
      const code = codeInput.value.trim() || 'Book Code';
      const parsed = parseBookText(text);

      // Title & Author
      let fullTitle = parsed.title || 'UNTITLED';
      let displayTitle = fullTitle;
      if (fullTitle.includes('/')) {
        displayTitle = fullTitle.split('/')[1].trim();
      }
      if (!displayTitle) displayTitle = fullTitle;

      let author = parsed.author || '';
      let displayAuthor = author.replace(/\(.*?\)/g, '').trim();

      posterTitle.textContent = displayTitle.toUpperCase();
      posterAuthor.textContent = displayAuthor.toUpperCase();

      // Build meta rows
      const rows = [
        ['Title', fullTitle],
        ['Author', author],
        ['Publisher', parsed.publisher],
        ['Publication Date', parsed.date],
        ['Binding', parsed.binding],
        ['Condition', parsed.condition || ''],
        ['Edition', parsed.edition],
        ['Printed in', parsed.printedIn],
        ['Notes', parsed.notes]
      ].filter(r => r[1]);

      posterMeta.innerHTML = '';
      let totalChars = 0;
      for (const [label, value] of rows) {
        if (value) {
          totalChars += value.length;
          const row = document.createElement('div');
          row.className = 'meta-row';
          row.innerHTML = `<span class="meta-label">${label}</span><span class="meta-value">${value}</span>`;
          posterMeta.appendChild(row);
        }
      }

      // Dynamic font size for meta
      if (totalChars > 340) {
        posterMeta.style.fontSize = '0.68rem';
        posterMeta.style.gap = '4px';
      } else if (totalChars > 220) {
        posterMeta.style.fontSize = '0.74rem';
        posterMeta.style.gap = '5px';
      } else {
        posterMeta.style.fontSize = '0.78rem';
        posterMeta.style.gap = '6px';
      }

      // Footer
      footerCode.textContent = code.startsWith('Book Code:') ? code : `Book Code: ${code}`;

      // Cover placeholder
      if (!coverDataUrl) {
        coverImg.style.display = 'none';
        placeholderIcon.style.display = 'block';
      } else {
        coverImg.style.display = 'block';
        placeholderIcon.style.display = 'none';
      }

      // Generate Caption
      generateCaption(fullTitle, author, rows, code);
    }

    // ---- Caption Generator ----
    function generateCaption(title, author, rows, code) {
      const get = (key) => {
        const found = rows.find(r => r[0].toLowerCase() === key.toLowerCase());
        return found ? found[1] : '';
      };
      const publisher = get('Publisher');
      const year = get('Publication Date');
      const edition = get('Edition');
      const binding = get('Binding');
      const condition = get('Condition');
      const printedIn = get('Printed in');
      const notes = get('Notes');

      const cleanTag = (s) => s.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
      const titleTag = cleanTag(title.split('/')[0]);
      const authorTag = cleanTag(author);

      let conditionLine = condition ? `• Condition: ${condition}` : '';
      let notesLine = notes ? `• Notes: ${notes}` : '';

      const caption = `📖 Rare Vintage Collectible: ${title}

${publisher ? `Published by ${publisher}` : ''}${year ? ` (${year})` : ''}${edition ? `, ${edition}` : ''}. A significant piece for bibliophiles and collectors.

---

📋 Bibliographical Details:
• Title: ${title}
• Author/Translator: ${author}
${publisher ? `• Publisher: ${publisher}` : ''}
${year ? `• Year: ${year}` : ''}
${edition ? `• Edition: ${edition}` : ''}
${binding ? `• Binding: ${binding}` : ''}
${conditionLine}
${printedIn ? `• Origin: Printed in ${printedIn}` : ''}
${notesLine}
• Inventory Code: ${code || 'Available on request'}

---

📩 DM us directly to claim or purchase.

.
.
#findrarebooks #rarebooks #vintagebooks #${authorTag} #${titleTag} #firstedition #bookcollecting #oldbooks #ukeditions #paperbackcollector`;

      captionOutput.textContent = caption;
    }

    // ---- Image upload ----
    function handleImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        coverDataUrl = e.target.result;
        coverImg.src = coverDataUrl;
        coverImg.style.display = 'block';
        placeholderIcon.style.display = 'none';
        uploadZone.classList.add('loaded');
        uploadLabel.textContent = '✅ Photo loaded';
        updatePoster();
      };
      reader.readAsDataURL(file);
    }

    // ---- Download ----
    function downloadPoster() {
      const node = document.getElementById('poster-node');
      const originalTransform = node.style.transform;
      node.style.transform = 'none';

      html2canvas(node, {
        scale: 2.5,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#000000',
        width: 800,
        height: 800
      }).then(canvas => {
        node.style.transform = originalTransform;
        const a = document.createElement('a');
        a.download = `Poster_${Date.now()}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      }).catch(() => {
        node.style.transform = originalTransform;
        alert('Download failed. Please try again.');
      });
    }

    // ---- Copy caption ----
    function copyCaption() {
      const text = captionOutput.textContent;
      if (!text || text === 'Loading caption...') {
        alert('Please generate the poster first.');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        alert('✅ Caption copied to clipboard!');
      }).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        alert('✅ Caption copied!');
      });
    }

    // ---- Auto-scale the poster inside the preview ----
    function scalePoster() {
      const wrapper = document.getElementById('scaleWrapper');
      const node = document.getElementById('poster-node');
      const w = wrapper.clientWidth;
      if (w > 0) {
        node.style.transform = `scale(${w / 800})`;
      }
    }

    // Use ResizeObserver for smooth scaling
    const ro = new ResizeObserver(() => { scalePoster(); });
    ro.observe(document.getElementById('scaleWrapper'));

    // ---- Init with sample data ----
    const sampleText = `Book Name: The New Testament Documents: Are They Reliable?
    Author: F. F. Bruce
    Publisher: The Inter-Varsity Fellowship
    Year: 1961
    Binding: Paperback
    Condition: Very Good
    Edition: Fifth Revised Edition
    Printed in: England
    Notes: Original price 3s. 6d.`;

    rawInput.value = sampleText;
    codeInput.value = 'FRB00011';
    updatePoster();
    setTimeout(scalePoster, 100);

    // also re-scale on window resize
    window.addEventListener('resize', scalePoster);
  </script>
</body>
</html>
